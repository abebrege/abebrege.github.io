<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Abe Brege</title>
    <!--
      SPA fallback for GitHub Pages. On a deep-link 404,
      redirect to /?/<path> so index.html can restore the real URL and let
      React Router take over. pathSegmentsToKeep = 0 for a user/org site
      (abebrege.github.io) served at the domain root.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
